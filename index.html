<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">

        <style>
                    .lilita-one-regular {
        font-family: "Lilita One", sans-serif;
        font-weight: 400;
        font-style: normal;
        }
            body {
                padding: 0;
                margin: 0;
                display: flex;
                flex-direction: column; /* Stacks items from top to bottom */
                align-items: center;    /* Centers items horizontally */
            }

            
            #front {
                display: flex;
                flex-direction: column; /* Stacks items from top to bottom */
                align-items: center;    /* Centers items horizontally */
                
                background-color: rgba(30,30,30,0.8);
                width: 75%;
                height: 100%;
                border-radius: 0px;
                
                padding: 30px;
                margin: 20px;
                border: 3px solid rgb(71, 55, 55);

               
            }
            
            #bg-img {
                position: fixed;
                background-image: url('./pictures/lens.gif');
                width: 100%;
                height: 100%;
                position: fixed;
                top: 0px;
                left: 0px;
                z-index: -1;
                background-size: auto 100%;
                background-repeat: repeat-x;
            }

            #welcome {
                color:white
                
            }

            #title {
                display:flex;
                flex-direction:row; /* Stacks items from top to bottom */
                align-items: center;    /* Centers items horizontally */
                white-space: pre-wrap;
            }

            #stuff {
                color: white;
                display: flex;
                flex-direction: column; /* Stacks items from top to bottom */
                align-items: center;    /* Centers items horizontally */
                
            }
            #items{
                width: 75vw;
                               display: flex;
                flex-direction: column; /* Stacks items from top to bottom */
                align-items: center;    /* Centers items horizontally */
                
            }

            #item {
                display:flex;
                flex-direction: row;
 
                height: 100%;
                width: 100%;
                border-radius: 0px;
                border-color: rgba(82, 38, 38, 0.8);
                border-width: 5px;
                background-color: rgba(209, 160, 160,0.1);
                
            }
            
            

            
        </style>
    </head>
    <body>
        <div id="bg-img"></div>
        <div id="front">
            <div id="title"></div>
            <img src="./pictures/pfp.png" width="100px" height="150px">
            
            <div id="stuff" class="lilita-one-regular">
                <h3>Now on a site because Discord profiles are boring 😭 (under construction)</h3>
                <img src="./pictures/underconstruction.jpg"></img>
                <div id="items">

             </div>
        </div>
        
        <script>
            let welcome_text = "Welcome to my bio!"


            var elements = []
           
            for(let i=0; i< welcome_text.length; i++) {
                 var e = document.createElement("h1")
                 e.textContent = welcome_text[i]
                 e.className = "lilita-one-regular"
                 e.id = "welcome"
                 e.style.position = "relative"
                 document.getElementById('title').appendChild(e)
                 elements.push(e)
            }

            var counter = 0;
            setInterval(function(){
                counter+=0.5;
                for(let i=0; i<elements.length;i++) {
                    const s = Math.floor(Math.sin(i+counter) * 2)
                    elements[i].style.top = s.toString() + "px"
                    elements[i].style.color = `rgb(${100+s*10+i},${50+s*10+i},${80+s*10+i})`
                    //console.log(elements[i].style.top)
                }
            },50)
            function add_normal_text(text,links){
                var categories = document.getElementById("items")
                

 
                var txt = document.createElement("h3")
                txt.innerText=text
                categories.appendChild(txt)
                


                

                
            }
            function add_cat(imgurl,text,desc,links){
                // fazer a formatação do titulo, foto de icone
                // da categoria
            
                var categories = document.getElementById("items")
                
                var divbox=document.createElement("div")
                divbox.id="item"
                divbox.style.border="3px solid rgb(71, 55, 55)"
                var img = document.createElement("img")
                img.src = imgurl
                img.style.height="150px"

                if(imgurl!=""){
                    divbox.appendChild(img)
                }
                

                var text_div = document.createElement("div")
                text_div.style.margin =" 0px 0px 0px 10px"

                var description_div = document.createElement("div")
                description_div.style.display="inline"
                description_div.style.flexDirection="row"


                var title = document.createElement("h2");
                title.innerText = text
                text_div.appendChild(title)

                
                var description = document.createElement("h3")
                description.innerHTML = desc
                if(links && links.length !=0) {

                    for(let i=0; i<links.length; i++) {
                        description.innerHTML = description.innerHTML.replace("{l}","<a href='"+links[i]+"'>"+links[i]+"<a>")
                    }
                } 
                description_div.appendChild(description)
                text_div.appendChild(description_div)

                


                divbox.appendChild(text_div)

                categories.append(divbox)
                categories.append(document.createElement("br"))
                categories.append(document.createElement("br"))
                
            }
            add_cat("./pictures/sean0x_hello.webp","SeaN0X","My real life name is victor, but online most people call me Sea")
            add_normal_text("Stuff i like")
            add_cat("./pictures/anima3.webp","Geometry Dash", "I've been playing this game since 2023 and i broke 2 keyboards beacuse of it, still like it though. This is my profile on GDDL: {l}",["https://gdladder.com/profile/59193"])
            add_cat("./pictures/osu.png","Osu","since i bought a digital tablet to make art, in 2026, i also tried osu, now it's also my favorite game, i play it when i don't want to rage with GD, and i'm working my way to 4 stars now.")
            add_cat("./pictures/anima2.webp","Art","This is my main hobby today! i began making arts in 2021 and since then i fell in love with it, it's just nice how anything can come to reality, i mainly draw furry characters nowadays")
            add_cat("./pictures/programming.png","Programming", "I was interested in programming since 2017 but i really began learning in 2019, nowadays i rarely code, but i still use stuff i learned daily for something, and i still love programming in C and Javascript :D")
            add_cat("./pictures/math.jpg","Math", "I'll begin saying that i am NOT good at math, i know the basics of algebra, angles, geometry, derivatives and integrals, but i love it nonetheless, i always like to study some random subjects, one of my personal favorite ones is the collatz conjecture, it says that if you follow a simple list of steps with an initial number, it will always end in 4, no one to this day was able to prove it really always ends on 4 or not.")
            
        </script>
        
    </body>
</html>
